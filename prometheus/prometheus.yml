global:
  scrape_interval: 15s
  evaluation_interval: 15s

# App metrics arrive via OTLP -> collector -> remote write; scraping is only
# used for the observability stack's own health.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
