name: otel-poc

# ---------------------------------------------------------------------------
# OpenTelemetry POC — Grafana stack (Prometheus instead of Mimir)
#
#   apps (trading-engine, feed-handler) --OTLP--> otel-collector
#                                                        +--> Tempo   (traces)
#                                                        +--> Loki    (logs)
#                                                        +--> Prometheus (metrics, remote write)
#   Grafana reads from Prometheus / Loki / Tempo.
# ---------------------------------------------------------------------------

x-app-otel-env: &app-otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
  OTEL_PYTHON_EXCLUDED_URLS: healthz
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=poc

services:
  # ---------------------------------------------------------------- pipeline
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - tempo
      - loki
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9092:9090"   # 9090 taken on this host
    deploy:
      resources:
        limits:
          memory: 1G

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    deploy:
      resources:
        limits:
          memory: 1G

  tempo:
    image: grafana/tempo:2.7.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    deploy:
      resources:
        limits:
          memory: 1G

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: system
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"   # 3000 taken on this host
    depends_on:
      - prometheus
      - loki
      - tempo
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------- demo apps
  trading-engine:
    build: ./apps/trading-engine
    restart: unless-stopped
    environment:
      <<: *app-otel-env
      OTEL_SERVICE_NAME: trading-engine
      FEED_HANDLER_URL: http://feed-handler:8081
    ports:
      - "8080:8080"
    depends_on:
      - otel-collector
      - feed-handler
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  feed-handler:
    build: ./apps/feed-handler
    restart: unless-stopped
    environment:
      <<: *app-otel-env
      OTEL_SERVICE_NAME: feed-handler
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  loadgen:
    build: ./apps/loadgen
    restart: unless-stopped
    environment:
      TRADING_ENGINE_URL: http://trading-engine:8080
    depends_on:
      trading-engine:
        condition: service_healthy

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
