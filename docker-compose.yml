name: otel-poc

# ---------------------------------------------------------------------------
# OpenTelemetry POC — Grafana stack (Prometheus instead of Mimir)
#
#   feed-handler --pushes ticks--> trading-engine <--orders-- loadgen
#   apps --OTLP--> otel-collector --+--> Tempo   (traces)
#                                                        +--> Loki    (logs)
#                                                        +--> Prometheus (metrics, remote write)
#   Grafana reads from Prometheus / Loki / Tempo.
# ---------------------------------------------------------------------------

x-app-otel-env: &app-otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
  OTEL_PYTHON_EXCLUDED_URLS: healthz
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=poc

services:
  # ---------------------------------------------------------------- pipeline
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - tempo
      - loki
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9092:9090"   # 9090 taken on this host
    deploy:
      resources:
        limits:
          memory: 1G

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    deploy:
      resources:
        limits:
          memory: 1G

  tempo:
    image: grafana/tempo:2.7.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    deploy:
      resources:
        limits:
          memory: 1G

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: system
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"   # 3000 taken on this host
    depends_on:
      - prometheus
      - loki
      - tempo
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------- demo apps
  trading-engine:
    build: ./apps/trading-engine
    restart: unless-stopped
    environment:
      <<: *app-otel-env
      OTEL_SERVICE_NAME: trading-engine
    ports:
      - "8080:8080"
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  feed-handler:
    build: ./apps/feed-handler
    restart: unless-stopped
    environment:
      <<: *app-otel-env
      OTEL_SERVICE_NAME: feed-handler
      TRADING_ENGINE_URL: http://trading-engine:8080
    depends_on:
      otel-collector:
        condition: service_started
      # Publisher waits for its subscriber so the first batches land.
      trading-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ------------------------------------------------- eBPF auto-instrumentation
  # Beyla attaches to each app's PID namespace and captures HTTP at the
  # kernel level — zero-code metrics to contrast with the SDK telemetry.
  # Metrics-only OTLP export so eBPF traces don't duplicate the SDK traces.
  beyla-trading-engine:
    image: grafana/beyla:2.2.0
    restart: unless-stopped
    privileged: true
    pid: "service:trading-engine"
    environment:
      BEYLA_OPEN_PORT: "8080"
      BEYLA_METRICS_FEATURES: application,network
      BEYLA_NETWORK_METRICS: "true"
      BEYLA_METRICS_INTERVAL: 15s
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    depends_on:
      - trading-engine
      - otel-collector

  beyla-feed-handler:
    image: grafana/beyla:2.2.0
    restart: unless-stopped
    privileged: true
    pid: "service:feed-handler"
    environment:
      BEYLA_OPEN_PORT: "8081"
      BEYLA_METRICS_FEATURES: application,network
      BEYLA_NETWORK_METRICS: "true"
      BEYLA_METRICS_INTERVAL: 15s
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    depends_on:
      - feed-handler
      - otel-collector

  # OS/kernel-level eBPF metrics for the whole host: block I/O latency,
  # syscalls, softirq latency, page-cache hit ratio, TCP retransmits,
  # SYN backlog, UDP drops, OOM kills, process execs. Scraped by Prometheus.
  ebpf-exporter:
    image: ghcr.io/cloudflare/ebpf_exporter:latest
    restart: unless-stopped
    privileged: true
    pid: host
    environment:
      # exec-trace emits kernel-level process-exec spans over OTLP -> Tempo.
      OTEL_SERVICE_NAME: kernel-ebpf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    command:
      - --config.dir=/examples
      # Every bundled metric-producing example that attaches on kernel 6.17.
      # Excluded: cgroup-rstat-flushing + cachestat-pre-kernel-5.16 (won't
      # load on 6.17), xdp (attaches to host network interfaces), and the
      # remaining *-trace configs (span emitters that would flood Tempo;
      # exec-trace is kept because exec volume is low).
      - --config.names=accept-latency,biolatency,bpf-jit,cachestat,cephfs-dist,cfs-throttling,cgroup,exec-trace,ext4dist,icmp-ip,inet-frags,kfree_skb,kstack,llcstat,oomkill,pci,percpu-softirq,raw-tracepoints,regexp,shrinklat,softirq-latency,syscalls,tcp-retransmit,tcp-syn-backlog,tcp-window-clamps,timers,udp-drops,unix-accept-latency,unix-socket-backlog,uprobe
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

  loadgen:
    build: ./apps/loadgen
    restart: unless-stopped
    environment:
      TRADING_ENGINE_URL: http://trading-engine:8080
    depends_on:
      trading-engine:
        condition: service_healthy

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
